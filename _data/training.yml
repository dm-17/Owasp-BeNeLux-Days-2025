  - image   : Steven-Wierckx.png
    day     : 3/12/2025
    time    : 
    name    : Steven Wierckx
    bio     : >-
              I’m a secure development life-cycle security (SDLC) specialist with more 
              than 20 years of experience in creating and teaching courses, programming, 
              security testing, source code review, test automation, functional and 
              technical analysis, development, and database design. I have guided 
              organizations in achieving compliance for their SDLC for FDA MDR and ISO 
              27001. I am a team player with a constant drive to learn new things. I 
              have a passion for all aspects of the secure development lifecycle, I have 
              guided many customers in their efforts to reach a secure development 
              practice. I have spoken or thought courses at conferences such as OWASP 
              AppSec USA, O’Reilly Security Conference, Hack In The Box Amsterdam, 44CON, 
              BlackHat EU and BruCON. I have created (and thought) several courses on 
              threat modelling, secure programming, security awareness and testing 
              software for security.
    title   : Threat modeling with AI
    abstract: >-
              This workshop aims to introduce Security Professionals, Developers, 
              Architects, and Product Managers to integrating AI assistance into their 
              threat modeling workflows. In this session, participants will learn how to 
              leverage AI for diagramming, threat identification, and countermeasure 
              recommendations to speed up threat model analysis.<br />
              To bring these concepts to life, the workshop includes a guided case 
              study on a Digital Wallet / Payment App, where participants will use AI 
              tools to generate a data flow diagram, identify threats using STRIDE, 
              propose mitigations mapped to industry standards, and summarize findings 
              for business stakeholders. This integrated exercise provides an engaging, 
              end-to-end view of how AI can support—but not replace—human judgment in 
              threat modeling.
    feed    :
    url     : 
    linkedin: https://www.linkedin.com/in/steven-wierckx/
    x_handle:
    reqs    : >-
              While participants should have a working knowledge of Generative AI and LLM 
              concepts and tools (e.g., prompt engineering), no prior experience with threat 
              modeling is required.<br />
              <br />
              Bring a laptop, have at least access to one AI chatbot of your choice, no other 
              tools required. Both free and paying versions of AI chatbots can be used.
